[project]
name = "ppo-frogger"
version = "0.1.0"
description = "PPO en ALE/Frogger-v5 (Gymnasium Atari): entorno, evaluacion y helper testable para el notebook educativo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ale-py==0.12.1",  # newest available on PyPI; bundles the ROMs inside the wheel
    "gymnasium>=1.0,<2",
    "stable-baselines3==2.9.0",
    "torch",
    "numpy",
    "opencv-python-headless",
    "matplotlib",
    "imageio",
    "pillow",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbclient",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true