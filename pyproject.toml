[project]
name = "rl-lab"
version = "0.1.0"
description = "Laboratorio de aprendizaje por refuerzo: PPO en Walker2d-v5 (MuJoCo) y experimentos previos en Frogger (ALE)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ale-py==0.12.1",  # newest available on PyPI; bundles the ROMs inside the wheel
    "gymnasium[mujoco]>=1.0,<2",
    "stable-baselines3==2.9.0",
    "torch",
    "numpy",
    "opencv-python-headless",
    "matplotlib",
    "imageio",
    "pillow",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbclient",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true